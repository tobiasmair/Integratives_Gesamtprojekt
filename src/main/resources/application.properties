server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# PostgreSQL configuration.
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres_database
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
# Zeit in ms, die Hikari auf eine Verbindung wartet (standardmaeﬂig 30000ms)
spring.datasource.hikari.connectionTimeout=2000
spring.datasource.hikari.validationTimeout=1000

# spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,com.flowingcode,com.gesamtprojekt.application
spring.jpa.defer-datasource-initialization = true