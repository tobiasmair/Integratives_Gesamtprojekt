<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | MCI Booking Service</title>
    <style>
        :root {
            --mci-blue: #005f9a;
            --text-color: #232d33;
            --secondary-text: #707679;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f7f8;
            color: var(--text-color);
            text-align: center;
        }
        .container {
            max-width: 450px;
            padding: 3rem 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        img.logo {
            display: block;
            margin: 0 auto 1.5rem auto;
            width: 120px;
            height: auto;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            background: #fff0f0;
            color: #e60000;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--mci-blue);
        }
        p {
            line-height: 1.6;
            color: var(--secondary-text);
            margin-bottom: 1.5rem;
            padding: 0 10px;
        }
        .retry-button {
            margin-top: 1rem;
            padding: 12px 32px;
            background-color: var(--mci-blue);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .retry-button:hover {
            background-color: #004a77;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="icons/mci_logo.png" alt="MCI Logo" class="logo">

    <div class="status-badge">OFFLINE MODE</div>

    <h1>Connection Lost</h1>
    <p>MCI Booking Service is currently unable to reach the server. Please check your internet connection, consult IT-Services or directly complain to Peter Paone.</p>

    <p><small>Room terminals will attempt to reconnect automatically.</small></p>

    <button class="retry-button" onclick="window.location.reload()">Try Reconnect</button>
</div>

<script>
    /**
     * Every 5 seconds the application tries to reach the server.
     * If the server answers, the page gets refreshed
     */
    function checkServerAvailability() {
        // tries to load the MCI Logo from the server
        fetch('icons/mci_logo.png?t=' + new Date().getTime(), {
            mode: 'no-cors',
            cache: 'no-store'
        })
        .then(() => {
            // Server answers -> refresh
            console.log("Server is back online. Reloading...");
            window.location.reload();
        })
        .catch(() => {
            // Server not answering -> try again
            console.log("Trying to reach the server...");
        });
    }

    // check every 5 seconds
    const retryInterval = setInterval(checkServerAvailability, 5000);

    // additional refresh function if the issue is network-based
    window.addEventListener('online', () => {
        checkServerAvailability();
    });
</script>
</body>
</html>
